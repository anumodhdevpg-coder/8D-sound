<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#07070f"/>
<title>8D Space</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;
  --s1:#0e0e1c;
  --s2:#14142a;
  --border:rgba(255,255,255,0.07);
  --border-hi:rgba(255,255,255,0.15);
  --text:#f0f0fa;
  --muted:#5a5a7a;
  --muted2:#3a3a55;
  --accent:#7c6cff;
  --accent2:#ff6cab;
  --green:#3dffa0;
  --sans:'DM Sans',sans-serif;
  --serif:'Instrument Serif',serif;
  --radius:16px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ─── Ambient background ─── */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,108,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 80%, rgba(255,108,171,0.08) 0%, transparent 55%);
  pointer-events:none;z-index:0;
}

/* ─── Layout ─── */
.app{
  position:relative;z-index:1;
  max-width:430px;margin:0 auto;
  padding:0 18px env(safe-area-inset-bottom,24px);
  display:flex;flex-direction:column;gap:16px;
  min-height:100dvh;padding-top:24px;padding-bottom:32px;
}

/* ─── Header ─── */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.logo{display:flex;align-items:baseline;gap:6px}
.logo-text{font-family:var(--serif);font-style:italic;font-size:1.75rem;color:var(--text);letter-spacing:-0.5px}
.logo-badge{font-size:0.6rem;font-weight:600;letter-spacing:2px;color:var(--accent);background:rgba(124,108,255,0.12);border:1px solid rgba(124,108,255,0.25);padding:3px 7px;border-radius:20px;text-transform:uppercase;margin-bottom:2px}
.header-status{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--muted);font-weight:500}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted2)}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* ─── Search ─── */
.search-wrap{position:relative}
.search-box{
  display:flex;align-items:center;gap:0;
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.search-box:focus-within{border-color:rgba(124,108,255,0.5);box-shadow:0 0 0 3px rgba(124,108,255,0.08)}
.search-icon{padding:0 14px;color:var(--muted);font-size:1rem;flex-shrink:0;pointer-events:none}
.search-input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:var(--sans);font-size:0.88rem;font-weight:400;
  padding:14px 0;
}
.search-input::placeholder{color:var(--muted)}
.search-clear{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:14px 14px;font-size:1rem;transition:color 0.15s;display:none;
}
.search-clear.visible{display:block}
.search-clear:hover{color:var(--text)}
.search-btn{
  background:var(--accent);border:none;color:#fff;
  font-family:var(--sans);font-weight:600;font-size:0.8rem;
  padding:0 20px;height:100%;min-height:48px;cursor:pointer;
  transition:opacity 0.15s,background 0.15s;letter-spacing:0.3px;
  flex-shrink:0;
}
.search-btn:hover{opacity:0.88}
.search-btn:active{opacity:0.7}

/* Suggestions dropdown */
.suggestions{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--s1);border:1px solid var(--border-hi);
  border-radius:14px;overflow:hidden;z-index:200;
  box-shadow:0 24px 48px rgba(0,0,0,0.6);
  animation:dropIn 0.15s ease;
}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.suggestions.hidden{display:none}
.sugg-section-label{
  font-size:0.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);padding:12px 16px 6px;
}
.sugg-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;cursor:pointer;transition:background 0.12s;
  border-top:1px solid var(--border);
}
.sugg-item:first-of-type{border-top:none}
.sugg-item:hover,.sugg-item.active{background:rgba(255,255,255,0.04)}
.sugg-thumb{
  width:44px;height:32px;border-radius:6px;object-fit:cover;
  flex-shrink:0;background:var(--s2);
}
.sugg-thumb-icon{
  width:44px;height:32px;border-radius:6px;
  background:var(--s2);display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;color:var(--muted);
}
.sugg-info{flex:1;min-width:0}
.sugg-title{font-size:0.82rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg-sub{font-size:0.7rem;color:var(--muted);margin-top:2px}
.sugg-loading{padding:20px;text-align:center;font-size:0.78rem;color:var(--muted)}
.sugg-spinner{
  display:inline-block;width:14px;height:14px;border:2px solid var(--muted2);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Now Playing Bar ─── */
.np-bar{
  display:flex;align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--border);border-radius:14px;
  padding:12px 16px;transition:all 0.3s;
}
.np-bar.hidden{display:none}
.np-art{
  width:40px;height:40px;border-radius:8px;object-fit:cover;
  flex-shrink:0;background:var(--s2);
}
.np-art-placeholder{
  width:40px;height:40px;border-radius:8px;background:var(--s2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
}
.np-info{flex:1;min-width:0}
.np-title{font-size:0.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-state{font-size:0.68rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.np-wave{display:flex;gap:2px;align-items:flex-end;height:10px}
.np-wave span{
  width:2px;background:var(--accent);border-radius:1px;
  animation:wave 0.8s ease-in-out infinite;
}
.np-wave span:nth-child(1){height:4px;animation-delay:0s}
.np-wave span:nth-child(2){height:8px;animation-delay:0.15s}
.np-wave span:nth-child(3){height:6px;animation-delay:0.3s}
.np-wave span:nth-child(4){height:10px;animation-delay:0.1s}
@keyframes wave{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
.np-controls{display:flex;gap:4px}
.np-btn{
  width:32px;height:32px;border-radius:8px;border:none;
  background:rgba(255,255,255,0.06);color:var(--text);
  cursor:pointer;font-size:0.8rem;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.np-btn:hover{background:rgba(255,255,255,0.12)}
.np-btn:disabled{opacity:0.3;cursor:not-allowed}

/* ─── Canvas ─── */
.canvas-wrap{position:relative}
#spatialCanvas{
  width:100%;height:340px;border-radius:20px;
  border:1px solid var(--border);background:var(--s1);
  touch-action:none;cursor:grab;display:block;
}
#spatialCanvas:active{cursor:grabbing}
.canvas-overlay{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;
  font-size:0.65rem;color:var(--muted);pointer-events:none;
  white-space:nowrap;
}
.canvas-overlay span{opacity:0.6}

/* ─── Speaker Controls ─── */
.spk-controls{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
}
.spk-side{display:flex;flex-direction:column;align-items:center;gap:8px}
.spk-label{font-size:0.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.spk-color-wrap{position:relative;width:44px;height:44px}
.spk-color-wrap input[type=color]{
  width:100%;height:100%;border:none;border-radius:50%;padding:3px;
  background:none;cursor:pointer;outline:none;
}
.spk-color-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(255,255,255,0.1);pointer-events:none;
  transition:border-color 0.2s;
}
.spk-color-wrap:hover .spk-color-ring{border-color:rgba(255,255,255,0.3)}
.spk-vol{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.spk-vol label{font-size:0.6rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.vol-slider{
  -webkit-appearance:none;width:80px;height:3px;
  background:var(--s2);border-radius:2px;outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;
  box-shadow:0 0 6px rgba(124,108,255,0.5);
}
.center-play{display:flex;flex-direction:column;align-items:center;gap:8px}
.play-btn{
  width:52px;height:52px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;font-size:1.2rem;
  cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(124,108,255,0.35);
}
.play-btn:hover{transform:scale(1.06);box-shadow:0 6px 28px rgba(124,108,255,0.5)}
.play-btn:active{transform:scale(0.96)}
.play-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}

/* ─── Stats Row ─── */
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.stat-card{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.stat-label{font-size:0.58rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.stat-val{font-size:0.88rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

/* ─── Presets ─── */
.presets-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.presets-row::-webkit-scrollbar{display:none}
.preset-btn{
  flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--s1);color:var(--muted);font-family:var(--sans);
  font-size:0.75rem;font-weight:500;cursor:pointer;
  transition:all 0.15s;white-space:nowrap;
}
.preset-btn:hover{border-color:var(--border-hi);color:var(--text)}
.preset-btn.active{background:rgba(124,108,255,0.12);border-color:rgba(124,108,255,0.4);color:var(--accent)}

/* ─── Reverb / Effect Toggle ─── */
.fx-row{
  display:flex;gap:8px;
}
.fx-card{
  flex:1;background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:all 0.15s;
}
.fx-card:hover{border-color:var(--border-hi)}
.fx-card.on{border-color:rgba(124,108,255,0.3);background:rgba(124,108,255,0.06)}
.fx-name{font-size:0.78rem;font-weight:500}
.fx-desc{font-size:0.65rem;color:var(--muted);margin-top:2px}
.toggle{
  width:36px;height:20px;border-radius:10px;background:var(--s2);
  position:relative;transition:background 0.2s;flex-shrink:0;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:14px;height:14px;border-radius:50%;background:#fff;
  transition:transform 0.2s;
}
.toggle.on::after{transform:translateX(16px)}

/* ─── YouTube hidden ─── */
.yt-hidden{position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ─── Tooltip ─── */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--s2);border:1px solid var(--border-hi);
  border-radius:10px;padding:10px 18px;font-size:0.78rem;color:var(--text);
  opacity:0;transition:all 0.25s;pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-text">8D Space</span>
      <span class="logo-badge">Beta</span>
    </div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Search song or paste YouTube link…"
        autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button class="search-clear" id="searchClear">✕</button>
      <button class="search-btn" id="searchBtn">Search</button>
    </div>
    <div class="suggestions hidden" id="suggestions"></div>
  </div>

  <!-- Now Playing -->
  <div class="np-bar hidden" id="npBar">
    <div class="np-art-placeholder" id="npArtWrap">🎵</div>
    <div class="np-info">
      <div class="np-title" id="npTitle">—</div>
      <div class="np-state">
        <div class="np-wave" id="npWave" style="display:none">
          <span></span><span></span><span></span><span></span>
        </div>
        <span id="npStateText">Paused</span>
      </div>
    </div>
    <div class="np-controls">
      <button class="np-btn" id="btnPrev" title="Previous" disabled>⏮</button>
      <button class="np-btn" id="btnStop" title="Stop" disabled>⏹</button>
    </div>
  </div>

  <!-- Presets -->
  <div class="presets-row" id="presetsRow">
    <button class="preset-btn active" data-preset="custom">Custom</button>
    <button class="preset-btn" data-preset="concert">🎸 Concert</button>
    <button class="preset-btn" data-preset="whisper">🤫 Whisper</button>
    <button class="preset-btn" data-preset="surround">🌀 Surround</button>
    <button class="preset-btn" data-preset="tunnel">🚇 Tunnel</button>
    <button class="preset-btn" data-preset="spin">🔄 Spin</button>
  </div>

  <!-- Spatial Canvas -->
  <div class="canvas-wrap">
    <canvas id="spatialCanvas"></canvas>
    <div class="canvas-overlay">
      <span>drag speakers to move sound</span>
    </div>
  </div>

  <!-- Speaker Controls -->
  <div class="spk-controls">
    <div class="spk-side">
      <div class="spk-label">Left</div>
      <div class="spk-color-wrap">
        <input type="color" id="colorL" value="#7c6cff"/>
        <div class="spk-color-ring"></div>
      </div>
      <div class="spk-vol">
        <label>Vol</label>
        <input type="range" class="vol-slider" id="volL" min="0" max="100" value="100"/>
      </div>
    </div>

    <div class="center-play">
      <button class="play-btn" id="btnPlay" disabled>▶</button>
      <span style="font-size:0.65rem;color:var(--muted)">Play / Pause</span>
    </div>

    <div class="spk-side">
      <div class="spk-label">Right</div>
      <div class="spk-color-wrap">
        <input type="color" id="colorR" value="#ff6cab"/>
        <div class="spk-color-ring"></div>
      </div>
      <div class="spk-vol">
        <label>Vol</label>
        <input type="range" class="vol-slider" id="volR" min="0" max="100" value="100"/>
      </div>
    </div>
  </div>

  <!-- FX Row -->
  <div class="fx-row">
    <div class="fx-card" id="fxReverb">
      <div>
        <div class="fx-name">Reverb</div>
        <div class="fx-desc">Room ambience</div>
      </div>
      <div class="toggle" id="toggleReverb"></div>
    </div>
    <div class="fx-card" id="fxBass">
      <div>
        <div class="fx-name">Bass Boost</div>
        <div class="fx-desc">Deep low-end</div>
      </div>
      <div class="toggle" id="toggleBass"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">L Pan</div><div class="stat-val" id="sLPan">0.00</div></div>
    <div class="stat-card"><div class="stat-label">L Dist</div><div class="stat-val" id="sLDist">0.00</div></div>
    <div class="stat-card"><div class="stat-label">R Pan</div><div class="stat-val" id="sRPan">0.00</div></div>
    <div class="stat-card"><div class="stat-label">R Dist</div><div class="stat-val" id="sRDist">0.00</div></div>
  </div>

</div>

<!-- Hidden YouTube -->
<div class="yt-hidden"><div id="ytPlayer"></div></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
function toast(msg, dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
function setStatus(text,live=false){
  document.getElementById('statusText').textContent=text;
  document.getElementById('statusDot').className='status-dot'+(live?' live':'');
}

// ════════════════════════════════════════════
// CANVAS — HEAD + SPEAKERS
// ════════════════════════════════════════════
const Canvas=(()=>{
  let cv,ctx,W,H,colorL='#7c6cff',colorR='#ff6cab';
  let head={x:0,y:0,r:0};
  let spk={L:{x:0,y:0,drag:false},R:{x:0,y:0,drag:false}};
  let onUpdate=null;
  let spinAngle=0,spinActive=false,spinRAF=null;

  function init(cb){
    cv=document.getElementById('spatialCanvas');
    ctx=cv.getContext('2d');
    onUpdate=cb;
    resize();
    window.addEventListener('resize',resize);
    cv.addEventListener('mousedown',onDown);
    cv.addEventListener('mousemove',onMove);
    cv.addEventListener('mouseup',onUp);
    cv.addEventListener('mouseleave',onUp);
    cv.addEventListener('touchstart',e=>{e.preventDefault();onDown(touch2mouse(e))},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault();onMove(touch2mouse(e))},{passive:false});
    cv.addEventListener('touchend',onUp);
    document.getElementById('colorL').addEventListener('input',e=>{colorL=e.target.value;draw()});
    document.getElementById('colorR').addEventListener('input',e=>{colorR=e.target.value;draw()});
    draw();
  }

  function resize(){
    const r=cv.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    ctx.scale(dpr,dpr);W=r.width;H=r.height;
    head={x:W/2,y:H/2,r:Math.min(W,H)*0.17};
    if(!spk.L.x){spk.L={x:W*0.18,y:H*0.5,drag:false};}
    if(!spk.R.x){spk.R={x:W*0.82,y:H*0.5,drag:false};}
    draw();
  }

  function touch2mouse(e){
    const r=cv.getBoundingClientRect(),t=e.touches[0];
    return{clientX:t.clientX,clientY:t.clientY,_rect:r};
  }
  function getXY(e){
    const r=e._rect||cv.getBoundingClientRect();
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function hit(p,s){const dx=p.x-s.x,dy=p.y-s.y;return Math.sqrt(dx*dx+dy*dy)<32}

  function onDown(e){const p=getXY(e);if(hit(p,spk.L))spk.L.drag=true;else if(hit(p,spk.R))spk.R.drag=true;}
  function onUp(){spk.L.drag=spk.R.drag=false;}
  function onMove(e){
    const p=getXY(e);let moved=false;
    for(const k of['L','R']){if(spk[k].drag){spk[k].x=clamp(p.x,20,W-20);spk[k].y=clamp(p.y,20,H-20);moved=true;}}
    if(moved){stopSpin();draw();if(onUpdate)onUpdate(getSpatial());}
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  // ── Drawing ──
  function drawGrid(){
    ctx.save();
    for(let gx=0;gx<W;gx+=28)for(let gy=0;gy<H;gy+=28){
      ctx.beginPath();ctx.arc(gx,gy,1,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.035)';ctx.fill();
    }
    ctx.restore();
  }

  function drawRing(x,y,r,color,alpha=0.15){
    ctx.save();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=1;
    ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }

  function drawHead(){
    const{x,y,r}=head;
    ctx.save();
    // Outer glow
    const g=ctx.createRadialGradient(x,y,r*0.2,x,y,r*2.2);
    g.addColorStop(0,'rgba(255,255,255,0.03)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fill();
    // Fill
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fill();
    // Outline
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.5;ctx.stroke();
    // Ears
    for(const side of[-1,1]){
      ctx.beginPath();
      ctx.arc(x+side*r,y,r*0.17,side===1?-Math.PI*0.55:Math.PI*0.45,side===1?Math.PI*0.55:-Math.PI*0.45);
      ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.stroke();
    }
    // Nose
    ctx.beginPath();
    ctx.moveTo(x-r*0.1,y-r*0.85);
    ctx.quadraticCurveTo(x,y-r*1.22,x+r*0.1,y-r*0.85);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.2;ctx.stroke();
    // Center
    ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();
    // Label
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='500 10px DM Sans,sans-serif';
    ctx.textAlign='center';ctx.fillText('YOU',x,y+r+14);
    ctx.restore();
  }

  function drawLine(a,b,color){
    ctx.save();ctx.setLineDash([3,7]);
    ctx.strokeStyle=color+'33';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }

  function drawSpeaker(s,color,label){
    const{x,y,drag}=s;
    const sz=drag?20:16;
    ctx.save();
    // Glow
    const g=ctx.createRadialGradient(x,y,0,x,y,sz*3);
    g.addColorStop(0,color+'44');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,sz*3,0,Math.PI*2);ctx.fill();
    // Body
    const w=sz*1.5,h=sz*2,rx=sz*0.35;
    ctx.beginPath();roundRect(ctx,x-w/2,y-h/2,w,h,rx);
    ctx.fillStyle=drag?color+'22':color+'18';
    ctx.strokeStyle=color;ctx.lineWidth=drag?2:1.5;
    ctx.fill();ctx.stroke();
    // Cone rings
    for(let i=1;i<=3;i++){
      ctx.beginPath();ctx.arc(x,y,(sz*0.5*i)/3,0,Math.PI*2);
      ctx.strokeStyle=color+(i===1?'ff':i===2?'88':'33');
      ctx.lineWidth=i===1?1.8:1;ctx.stroke();
    }
    // Dot
    ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    // Label
    ctx.fillStyle=color;ctx.font='600 10px DM Sans,sans-serif';
    ctx.textAlign='center';ctx.fillText(label,x,y+h/2+13);
    ctx.restore();
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);
    c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);
    c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
    c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);
    c.quadraticCurveTo(x,y,x+r,y);c.closePath();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGrid();
    // Range rings
    drawRing(head.x,head.y,head.r*2,'#7c6cff',0.1);
    drawRing(head.x,head.y,head.r*3.5,'#7c6cff',0.06);
    drawLine(spk.L,head,colorL);
    drawLine(spk.R,head,colorR);
    drawHead();
    drawSpeaker(spk.L,colorL,'L');
    drawSpeaker(spk.R,colorR,'R');
  }

  // ── Spatial data ──
  function getSpatial(){
    const maxD=Math.sqrt(W*W+H*H)/2;
    function norm(s){
      const dx=s.x-head.x,dy=s.y-head.y,d=Math.sqrt(dx*dx+dy*dy);
      return{pan:Math.max(-1,Math.min(1,dx/(W/2))),elevation:Math.max(-1,Math.min(1,-dy/(H/2))),distance:d/maxD};
    }
    const data={L:norm(spk.L),R:norm(spk.R)};
    document.getElementById('sLPan').textContent=data.L.pan.toFixed(2);
    document.getElementById('sLDist').textContent=data.L.distance.toFixed(2);
    document.getElementById('sRPan').textContent=data.R.pan.toFixed(2);
    document.getElementById('sRDist').textContent=data.R.distance.toFixed(2);
    return data;
  }

  // ── Presets ──
  function setPreset(name){
    stopSpin();
    const cx=W/2,cy=H/2,r=head.r;
    const presets={
      custom:null,
      concert:{L:{x:cx-W*0.32,y:cy-H*0.25},R:{x:cx+W*0.32,y:cy-H*0.25}},
      whisper:{L:{x:cx-r*1.5,y:cy},R:{x:cx+r*1.5,y:cy}},
      surround:{L:{x:cx-W*0.38,y:cy+H*0.2},R:{x:cx+W*0.38,y:cy-H*0.2}},
      tunnel:{L:{x:cx-r*0.8,y:cy-H*0.35},R:{x:cx+r*0.8,y:cy+H*0.35}},
    };
    if(name==='spin'){startSpin();return;}
    if(presets[name]){
      spk.L={...spk.L,...presets[name].L};
      spk.R={...spk.R,...presets[name].R};
      draw();if(onUpdate)onUpdate(getSpatial());
    }
  }

  function startSpin(){
    spinActive=true;
    const r=head.r*2.8;
    function frame(){
      if(!spinActive)return;
      spinAngle+=0.015;
      spk.L.x=head.x+Math.cos(spinAngle)*r;
      spk.L.y=head.y+Math.sin(spinAngle)*r;
      spk.R.x=head.x+Math.cos(spinAngle+Math.PI)*r;
      spk.R.y=head.y+Math.sin(spinAngle+Math.PI)*r;
      draw();if(onUpdate)onUpdate(getSpatial());
      spinRAF=requestAnimationFrame(frame);
    }
    frame();
  }
  function stopSpin(){spinActive=false;if(spinRAF)cancelAnimationFrame(spinRAF);}

  return{init,draw,getSpatial,setPreset};
})();

// ════════════════════════════════════════════
// AUDIO ENGINE
// ════════════════════════════════════════════
const Audio3D=(()=>{
  let ac=null,src=null,splitter,panL,panR,gainL,gainR,gainVolL,gainVolR,merger,master,reverb,bass,reverbGain,bassNode;
  let reverbOn=false,bassOn=false;
  let ready=false;

  function init(){
    try{
      ac=new(window.AudioContext||window.webkitAudioContext)();
      _build();ready=true;
    }catch(e){console.warn('AudioContext error',e);}
  }

  function _build(){
    splitter=ac.createChannelSplitter(2);
    gainVolL=ac.createGain();gainVolR=ac.createGain();
    gainL=ac.createGain();gainR=ac.createGain();
    panL=ac.createPanner();panR=ac.createPanner();
    [panL,panR].forEach(p=>{
      p.panningModel='HRTF';p.distanceModel='inverse';
      p.refDistance=1;p.maxDistance=10000;p.rolloffFactor=1;
      p.coneInnerAngle=360;p.coneOuterAngle=0;p.coneOuterGain=0;
    });
    merger=ac.createChannelMerger(2);
    // Bass EQ
    bassNode=ac.createBiquadFilter();bassNode.type='lowshelf';bassNode.frequency.value=200;bassNode.gain.value=0;
    // Reverb (convolver with synthetic IR)
    reverb=ac.createConvolver();
    reverbGain=ac.createGain();reverbGain.gain.value=0;
    _buildIR();
    master=ac.createGain();master.gain.value=1;
    // Route: splitter→volGain→pannerChain→merger→bass→master→reverb(wet)→dest
    splitter.connect(gainVolL,0);gainVolL.connect(gainL);gainL.connect(panL);panL.connect(merger,0,0);
    splitter.connect(gainVolR,1);gainVolR.connect(gainR);gainR.connect(panR);panR.connect(merger,0,1);
    merger.connect(bassNode);bassNode.connect(master);master.connect(ac.destination);
    // Reverb wet path
    master.connect(reverb);reverb.connect(reverbGain);reverbGain.connect(ac.destination);
  }

  function _buildIR(){
    const sr=ac.sampleRate,len=sr*2,buf=ac.createBuffer(2,len,sr);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
    reverb.buffer=buf;
  }

  function connect(el){
    if(!ready)init();
    if(ac.state==='suspended')ac.resume();
    if(src){try{src.disconnect();}catch(e){}}
    src=ac.createMediaElementSource(el);
    src.connect(splitter);
  }

  function update(data){
    if(!ready)return;
    _pos(panL,gainL,data.L);_pos(panR,gainR,data.R);
  }

  function _pos(p,g,d){
    const x=d.pan*3,y=d.elevation*1.5,z=-(1-d.distance)*2;
    const t=ac.currentTime;
    if(p.positionX){p.positionX.setTargetAtTime(x,t,0.05);p.positionY.setTargetAtTime(y,t,0.05);p.positionZ.setTargetAtTime(z,t,0.05);}
    else p.setPosition(x,y,z);
    g.gain.setTargetAtTime(Math.max(0.1,1-d.distance*0.65),t,0.05);
  }

  function setVolL(v){if(gainVolL)gainVolL.gain.setTargetAtTime(v/100,ac.currentTime,0.05);}
  function setVolR(v){if(gainVolR)gainVolR.gain.setTargetAtTime(v/100,ac.currentTime,0.05);}
  function setReverb(on){reverbOn=on;if(reverbGain)reverbGain.gain.setTargetAtTime(on?0.35:0,ac.currentTime,0.1);}
  function setBass(on){bassOn=on;if(bassNode)bassNode.gain.setTargetAtTime(on?10:0,ac.currentTime,0.1);}
  function resume(){if(ac&&ac.state==='suspended')ac.resume();}
  return{init,connect,update,setVolL,setVolR,setReverb,setBass,resume};
})();

// ════════════════════════════════════════════
// YOUTUBE
// ════════════════════════════════════════════
let ytPlayer=null,ytReady=false,pendingId=null;
let currentResults=[];
let isPlaying=false;

window.onYouTubeIframeAPIReady=function(){
  ytPlayer=new YT.Player('ytPlayer',{
    height:'1',width:'1',
    playerVars:{autoplay:0,controls:0,origin:window.location.origin},
    events:{
      onReady:()=>{ytReady=true;if(pendingId){loadVideo(pendingId,pendingTitle);pendingId=null;}},
      onStateChange:onYTState
    }
  });
};

let pendingTitle='',currentThumb='';
function onYTState(e){
  const S=YT.PlayerState;
  if(e.data===S.PLAYING){
    isPlaying=true;setStatus('Playing',true);
    document.getElementById('btnPlay').textContent='⏸';
    document.getElementById('npWave').style.display='flex';
    document.getElementById('npStateText').textContent='Playing';
    enableControls(true);
  } else if(e.data===S.PAUSED){
    isPlaying=false;setStatus('Paused');
    document.getElementById('btnPlay').textContent='▶';
    document.getElementById('npWave').style.display='none';
    document.getElementById('npStateText').textContent='Paused';
  } else if(e.data===S.ENDED){
    isPlaying=false;setStatus('Ended');
    document.getElementById('btnPlay').textContent='▶';
    document.getElementById('npWave').style.display='none';
  }
}

function enableControls(on){
  ['btnPlay','btnStop','btnPrev'].forEach(id=>{document.getElementById(id).disabled=!on;});
}

function loadVideo(id,title,thumb){
  if(!ytReady){pendingId=id;pendingTitle=title||'';currentThumb=thumb||'';return;}
  Audio3D.resume();ytPlayer.loadVideoById(id);
  currentThumb=thumb||`https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  document.getElementById('npTitle').textContent=title||'YouTube video';
  // Art
  const wrap=document.getElementById('npArtWrap');
  if(currentThumb){
    wrap.innerHTML=`<img class="np-art" src="${currentThumb}" onerror="this.parentNode.innerHTML='🎵'" alt=""/>`;
  }
  document.getElementById('npBar').classList.remove('hidden');
  enableControls(true);setStatus('Loading…');
}

// ─ Search via Invidious ─
const INVIDIOUS=['https://invidious.privacyredirect.com','https://inv.nadeko.net','https://invidious.nerdvpn.de'];
const TRENDING_SUGGESTIONS=['Blinding Lights The Weeknd','Flowers Miley Cyrus','Shape of You Ed Sheeran','Levitating Dua Lipa','Stay Kid Laroi','As It Was Harry Styles','Heat Waves Glass Animals','Peaches Justin Bieber'];

async function searchYT(query){
  for(const base of INVIDIOUS){
    try{
      const r=await fetch(`${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&fields=videoId,title,videoThumbnails,author`,{signal:AbortSignal.timeout(6000)});
      if(!r.ok)continue;
      const d=await r.json();
      return d.slice(0,6).map(v=>({
        id:v.videoId,title:v.title,author:v.author||'',
        thumb:v.videoThumbnails?.[4]?.url||`https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg`
      }));
    }catch(e){continue;}
  }
  throw new Error('Search unavailable — paste a YouTube link directly');
}

// ════════════════════════════════════════════
// SEARCH UI
// ════════════════════════════════════════════
const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const suggestionsEl=document.getElementById('suggestions');
const clearBtn=document.getElementById('searchClear');

let debounceT=null;
let activeIdx=-1;

function showSuggestions(html){
  suggestionsEl.innerHTML=html;
  suggestionsEl.classList.remove('hidden');
}
function hideSuggestions(){
  suggestionsEl.classList.add('hidden');
  activeIdx=-1;
}

function renderTrending(){
  const items=TRENDING_SUGGESTIONS.map((s,i)=>
    `<div class="sugg-item" data-trending="${s}" tabindex="-1">
      <div class="sugg-thumb-icon">🔥</div>
      <div class="sugg-info">
        <div class="sugg-title">${s}</div>
        <div class="sugg-sub">Trending</div>
      </div>
    </div>`).join('');
  showSuggestions(`<div class="sugg-section-label">Trending</div>${items}`);
  suggestionsEl.querySelectorAll('[data-trending]').forEach(el=>{
    el.addEventListener('click',()=>{searchInput.value=el.dataset.trending;hideSuggestions();doSearch();});
  });
}

async function renderSearch(q){
  showSuggestions(`<div class="sugg-loading"><span class="sugg-spinner"></span>Searching…</div>`);
  try{
    const results=await searchYT(q);
    currentResults=results;
    if(!results.length){showSuggestions('<div class="sugg-loading">No results</div>');return;}
    const html=results.map((r,i)=>
      `<div class="sugg-item" data-idx="${i}" tabindex="-1">
        <img class="sugg-thumb" src="${r.thumb}" loading="lazy" onerror="this.style.display='none'" alt=""/>
        <div class="sugg-info">
          <div class="sugg-title">${esc(r.title)}</div>
          <div class="sugg-sub">${esc(r.author)}</div>
        </div>
      </div>`).join('');
    showSuggestions(`<div class="sugg-section-label">Results</div>${html}`);
    suggestionsEl.querySelectorAll('[data-idx]').forEach(el=>{
      el.addEventListener('click',()=>{
        const r=currentResults[+el.dataset.idx];
        selectResult(r);
      });
    });
  }catch(e){
    showSuggestions(`<div class="sugg-loading">${e.message}</div>`);
  }
}

function selectResult(r){
  searchInput.value=r.title;
  clearBtn.classList.add('visible');
  hideSuggestions();
  loadVideo(r.id,r.title,r.thumb);
}

function doSearch(){
  const q=searchInput.value.trim();
  if(!q)return;
  // Check for YouTube URL
  const m=q.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(m){loadVideo(m[1],'YouTube video','');hideSuggestions();return;}
  renderSearch(q);
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

searchInput.addEventListener('focus',()=>{
  if(!searchInput.value.trim())renderTrending();
});
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim();
  clearBtn.classList.toggle('visible',q.length>0);
  clearTimeout(debounceT);
  if(!q){renderTrending();return;}
  debounceT=setTimeout(()=>renderSearch(q),400);
});
searchInput.addEventListener('keydown',e=>{
  const items=[...suggestionsEl.querySelectorAll('.sugg-item')];
  if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
  else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,-1);items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
  else if(e.key==='Enter'){
    if(activeIdx>=0&&items[activeIdx]){items[activeIdx].click();}
    else doSearch();
  }
  else if(e.key==='Escape')hideSuggestions();
});
searchBtn.addEventListener('click',doSearch);
clearBtn.addEventListener('click',()=>{searchInput.value='';clearBtn.classList.remove('visible');hideSuggestions();searchInput.focus();});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideSuggestions();});

// ════════════════════════════════════════════
// PLAYBACK CONTROLS
// ════════════════════════════════════════════
document.getElementById('btnPlay').addEventListener('click',()=>{
  Audio3D.resume();
  if(isPlaying)ytPlayer.pauseVideo();else ytPlayer.playVideo();
});
document.getElementById('btnStop').addEventListener('click',()=>{
  ytPlayer.stopVideo();isPlaying=false;
  document.getElementById('npBar').classList.add('hidden');
  document.getElementById('btnPlay').textContent='▶';
  enableControls(false);setStatus('Ready');
});
document.getElementById('btnPrev').addEventListener('click',()=>{
  if(ytPlayer&&ytReady)ytPlayer.seekTo(0,true);
});

// ════════════════════════════════════════════
// VOLUME SLIDERS
// ════════════════════════════════════════════
document.getElementById('volL').addEventListener('input',e=>Audio3D.setVolL(+e.target.value));
document.getElementById('volR').addEventListener('input',e=>Audio3D.setVolR(+e.target.value));

// ════════════════════════════════════════════
// FX TOGGLES
// ════════════════════════════════════════════
function setupFX(cardId,toggleId,cb){
  let on=false;
  document.getElementById(cardId).addEventListener('click',()=>{
    on=!on;
    document.getElementById(toggleId).classList.toggle('on',on);
    document.getElementById(cardId).classList.toggle('on',on);
    cb(on);
    toast(on?'Effect ON':'Effect OFF');
  });
}
setupFX('fxReverb','toggleReverb',on=>Audio3D.setReverb(on));
setupFX('fxBass','toggleBass',on=>Audio3D.setBass(on));

// ════════════════════════════════════════════
// PRESETS
// ════════════════════════════════════════════
document.getElementById('presetsRow').addEventListener('click',e=>{
  const btn=e.target.closest('[data-preset]');
  if(!btn)return;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  Canvas.setPreset(btn.dataset.preset);
  toast(`Preset: ${btn.textContent.trim()}`);
});

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
Audio3D.init();
Canvas.init(data=>Audio3D.update(data));
Audio3D.update(Canvas.getSpatial());

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
