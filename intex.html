<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8D Space — Spatial Audio</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1 class="logo">8D<span>SPACE</span></h1>
      <p class="tagline">drag the speakers · feel the space</p>
    </header>

    <!-- YouTube Search -->
    <section class="search-section">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search song or paste YouTube link..." autocomplete="off" />
        <button id="searchBtn">GO</button>
      </div>
      <div id="searchResults" class="search-results hidden"></div>
    </section>

    <!-- Now Playing -->
    <div id="nowPlaying" class="now-playing hidden">
      <div class="np-dot"></div>
      <span id="nowPlayingTitle">—</span>
    </div>

    <!-- YouTube Player (hidden) -->
    <div id="ytPlayerWrap" class="yt-hidden">
      <div id="ytPlayer"></div>
    </div>

    <!-- Spatial Canvas -->
    <section class="canvas-section">
      <canvas id="spatialCanvas"></canvas>
      <div class="canvas-hint">Touch &amp; drag speakers</div>
    </section>

    <!-- Speaker Color Pickers -->
    <section class="controls">
      <div class="color-control">
        <label>Left Speaker</label>
        <input type="color" id="colorL" value="#00f5d4" />
      </div>
      <div class="playback-controls">
        <button id="btnPlay" class="ctrl-btn" disabled>▶</button>
        <button id="btnPause" class="ctrl-btn" disabled>⏸</button>
        <button id="btnStop" class="ctrl-btn" disabled>⏹</button>
      </div>
      <div class="color-control">
        <label>Right Speaker</label>
        <input type="color" id="colorR" value="#f72585" />
      </div>
    </section>

    <!-- 3D Info -->
    <section class="info-bar">
      <div class="info-item"><span class="lbl">L PAN</span><span id="infoLPan">0.00</span></div>
      <div class="info-item"><span class="lbl">L DIST</span><span id="infoLDist">0.00</span></div>
      <div class="info-item"><span class="lbl">R PAN</span><span id="infoRPan">0.00</span></div>
      <div class="info-item"><span class="lbl">R DIST</span><span id="infoRDist">0.00</span></div>
    </section>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="canvas.js"></script>
  <script src="audio-engine.js"></script>
  <script src="youtube.js"></script>
  <script src="app.js"></script>
</body>
                                                              </html>
